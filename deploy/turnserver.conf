# coturn config (step 5.4), static-auth-secret mode: the app server mints
# short-lived credentials from the same secret (TURN_SECRET in
# /etc/workspace.env). deploy.sh installs this file to /etc/turnserver.conf
# and appends the static-auth-secret line from the VPS-only env file.
# The TURN domain placeholders are filled in by deploy.sh (TURN_DOMAIN).
listening-port=3478
tls-listening-port=5349

# LE certificate synced from caddy's storage by turn-cert-sync (same deploy dir)
cert=/etc/coturn/certs/__TURN_DOMAIN__.crt
pkey=/etc/coturn/certs/__TURN_DOMAIN__.key

realm=__TURN_DOMAIN__
use-auth-secret
fingerprint

# relay port range — must match the ufw allowance (README one-time setup)
min-port=49152
max-port=65535

# hardening: no telnet admin CLI, and the relay may not reach multicast,
# loopback, or private ranges (blocks using the relay to probe the droplet)
no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
